spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lionbank_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: app
    password: app_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update        # 개발 중엔 update (테이블 자동 생성/변경)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always